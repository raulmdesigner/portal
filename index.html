    function q(name){return (S.data[name]||[])}
    function visibleData(name){return q(name).filter(x=>!S.search||JSON.stringify(x).toLowerCase().includes(S.search.toLowerCase()))}
    function stateLabel(value){return ({active:'Ativo',paused:'Pausado',archived:'Arquivado',planning:'Planejamento',review:'Em revisão',delivered:'Entregue',open:'Aberta',in_progress:'Em andamento',done:'Concluída',pending:'Aguardando',approved:'Aprovada',changes_requested:'Ajustes pedidos',released:'Liberado',awaiting_payment:'Aguardando pagamento',restricted:'Restrito',client_marked_paid:'Pagamento informado',confirmed:'Confirmado',blocked:'Bloqueada',suspended:'Suspenso',viewer:'Leitura'}[value]||value)}
    function pill(value){const c=/payment|changes|blocked|restricted|urgent/.test(value)?'red':/approved|released|done|active|confirmed/.test(value)?'teal':/pending|review|open|awaiting/.test(value)?'orange':'';return `<span class="pill ${c}">${esc(stateLabel(value))}</span>`}
    async function boot(){
      const {data:{session}}=await db.auth.getSession();
      if(!session){renderLogin();return}
      S.user=session.user;
      const {data:profile,error}=await db.from('portal_profiles').select('*').eq('id',S.user.id).maybeSingle();
      if(error||!profile){renderSetup('Sua conta entrou, mas o perfil do Portal ainda não existe. Execute a migração 001 no Supabase correto e promova a conta administrativa.');return}
      if(profile.status==='blocked'){await db.auth.signOut();renderLogin('Esta conta está bloqueada. Fale com o estúdio RMS.');return}
      S.profile=profile;S.admin=profile.role==='admin';await db.rpc('portal_mark_seen');
      if(route.admin&&!S.admin){await db.auth.signOut();renderLogin('Esta conta não tem acesso ao painel administrativo.');return}
      await loadContext();renderShell();
    }
    function renderLogin(error=''){
      const clientText=route.slug?'Use seu usuário e senha para abrir este espaço exclusivo.':'Acesse pelo link exclusivo enviado pelo estúdio RMS.';
      $('#app').innerHTML=`<main class="login-shell"><section class="login-card"><div class="login-art"><div class="brand"><span class="brand-mark">RMS</span><span>RMS Studio</span></div><h1>${route.admin?'Central de operação do estúdio.':'Seu projeto em movimento.'}</h1><p>${route.admin?'Clientes, calendário, aprovações, materiais e contas em uma área de trabalho organizada.':clientText}</p><div class="login-points"><span>Agenda clara</span><span>Decisões rastreáveis</span><span>Materiais protegidos</span></div></div><form id="login-form" class="login-form"><span class="eyebrow">Portal RMS</span><h2>${route.admin?'Entrar no estúdio':'Acompanhar projeto'}</h2><p>${route.admin?'Use seu e-mail administrativo ou usuário do RMS.':'O seu usuário foi definido pelo estúdio e não precisa ser um e-mail.'}</p><div class="field"><label for="login-user">${route.admin?'E-mail ou usuário':'Nome de usuário'}</label><input id="login-user" autocomplete="username" required placeholder="${route.admin?'raul@portfolio.com':'exemplo: yasmin'}" /></div><div class="field"><label for="login-password">Senha</label><input id="login-password" type="password" autocomplete="current-password" required placeholder="Sua senha" /></div><div id="login-error" class="error ${error?'show':''}">${esc(error)}</div><button class="btn primary" type="submit">Entrar no Portal</button><p class="form-note">${route.admin?'A conta administrativa é criada em Authentication no Supabase.':'Problemas de acesso? Fale diretamente com o estúdio.'}</p></form></section></main>`;
      $('#login-form').onsubmit=async e=>{e.preventDefault();const identifier=$('#login-user').value.trim(),password=$('#login-password').value;const email=identifier.includes('@')?identifier:techEmail(identifier);const errorEl=$('#login-error');errorEl.classList.remove('show');const {error}=await db.auth.signInWithPassword({email,password});if(error){errorEl.textContent='Não foi possível entrar. Revise usuário e senha.';errorEl.classList.add('show');return}location.reload()};
    }
    function renderSetup(text){$('#app').innerHTML=`<main class="login-shell"><section class="login-card"><div class="login-art"><div class="brand"><span class="brand-mark">RMS</span><span>RMS Studio</span></div><h1>O Portal ainda está sendo preparado.</h1></div><div class="login-form"><span class="eyebrow">Configuração pendente</span><h2>Falta uma etapa no banco</h2><p>${esc(text)}</p><button class="btn dark" onclick="location.reload()">Tentar novamente</button></div></section></main>`}
    async function loadContext(){
      let clientQuery=db.from('portal_clients').select('*').order('name');if(!S.admin&&route.slug)clientQuery=clientQuery.eq('slug',route.slug);
      const {data:clients,error}=await clientQuery; if(error){renderSetup('As tabelas do Portal não foram encontradas. Execute as migrações no Supabase correto.');throw error} S.clients=clients||[];
      S.client=(route.slug?S.clients.find(c=>c.slug===route.slug):null)||S.clients[0]||null;
      if(!S.client){S.data={};return}
      await loadClientData(S.client.id);
    }
    async function loadClientData(clientId){
      const tables=[['projects','portal_projects'],['events','portal_events'],['tasks','portal_tasks'],['approvals','portal_approvals'],['materials','portal_materials'],['updates','portal_updates'],['notes','portal_notes'],['activity','portal_activity'],['members','portal_client_members'],['payments','portal_payment_requests']];
      const results=await Promise.all(tables.map(async([key,table])=>{let query=db.from(table).select('*').eq('client_id',clientId);if(key==='activity')query=query.order('created_at',{ascending:false});if(key==='updates')query=query.order('created_at',{ascending:false});if(key==='events')query=query.order('start_at');if(key==='materials')query=query.order('created_at',{ascending:false});const {data,error}=await query;return [key,error?[]:(data||[])]}));
      S.data=Object.fromEntries(results);
      const ids=q('projects').map(p=>p.id);if(ids.length){const {data}=await db.from('portal_project_stages').select('*').in('project_id',ids).order('position');S.data.stages=data||[]}else S.data.stages=[];
      if(S.admin){const {data}=await db.from('portal_profiles').select('id,username,full_name,role,status,last_seen_at,created_at').order('created_at',{ascending:false});S.data.accounts=data||[]}
    }
    function icon(v){return ({overview:'◉',clients:'◌',accounts:'◎',projects:'◈',calendar:'◫',tasks:'✓',approvals:'◐',materials:'▣',updates:'✦',reports:'▤',settings:'⚙'}[v]||'•')}
    function navItems(){const all=[['overview','Visão do projeto'],['calendar','Agenda'],['tasks','Ações'],['approvals','Aprovações'],['materials','Materiais'],['updates','Atualizações'],['projects','Projetos'],['reports','Relatórios']];if(S.admin)return [['overview','Painel do estúdio'],['clients','Clientes'],['accounts','Contas'],...all,['settings','Personalização']];return all.filter(([k])=>k==='overview'||S.client?.sections?.[k]!==false)}
    function renderShell(){
      const clientName=S.client?.name||'Nenhum cliente selecionado';const menu=navItems();
      $('#app').innerHTML=`<div class="shell"><aside class="sidebar"><div class="side-head"><span class="brand-mark">RMS</span><div class="side-copy"><strong>RMS Studio</strong><span>${S.admin?'central de operação':'espaço do cliente'}</span></div></div><nav class="nav">${S.admin?'<div class="nav-label">Operação</div>':'<div class="nav-label">Acompanhamento</div>'}${menu.map(([id,label])=>`<button data-view="${id}" class="${S.view===id?'active':''}"><i>${icon(id)}</i>${label}</button>`).join('')}</nav><div class="side-bottom"><div class="mini-user"><div class="avatar">${initials(S.profile.full_name)}</div><div><strong>${esc(S.profile.full_name||S.profile.username)}</strong><span>${S.admin?'Administrador':'Cliente'}</span></div></div><button id="signout" class="btn line small">Sair do Portal</button></div></aside><section class="content"><header class="topbar"><div class="crumb"><button class="icon-btn mobile-nav" id="menu-toggle">☰</button><div><span>${S.admin?'RMS Studio':esc(clientName)}</span><h1 id="page-title">${esc((navItems().find(x=>x[0]===S.view)||[])[1]||'Portal')}</h1></div></div><div class="top-actions">${S.admin?`<select id="client-switch" class="filter">${S.clients.map(c=>`<option value="${c.id}" ${S.client?.id===c.id?'selected':''}>${esc(c.name)}</option>`).join('')}</select>`:''}<button class="btn line" id="quick-search">Buscar</button>${canCreate()?'<button class="btn primary" id="create-action">+ Criar</button>':''}</div></header><main class="main" id="main"></main></section></div>`;
      document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{S.view=b.dataset.view;S.search='';renderShell()});
      $('#signout').onclick=async()=>{await db.auth.signOut();location.href=location.pathname};
      $('#menu-toggle')?.addEventListener('click',()=>document.body.classList.toggle('nav-open'));
      $('#client-switch')?.addEventListener('change',async e=>{S.client=S.clients.find(c=>c.id===e.target.value);await loadClientData(S.client.id);S.view='overview';renderShell()});
      $('#quick-search').onclick=()=>searchModal(); $('#create-action')?.addEventListener('click',()=>createForView()); renderView();
    }
    function canCreate(){return S.admin&&['clients','accounts','projects','calendar','tasks','approvals','materials','updates'].includes(S.view)}
    function renderView(){const main=$('#main');if(!S.client&&S.view!=='clients'&&S.view!=='accounts'){main.innerHTML=empty('Crie um cliente para começar','A carteira ainda está vazia. Crie o primeiro portal de cliente e depois complete o projeto.','Criar cliente',()=>clientModal());return}const views={overview:overviewView,clients:clientsView,accounts:accountsView,projects:projectsView,calendar:calendarView,tasks:tasksView,approvals:approvalsView,materials:materialsView,updates:updatesView,reports:reportsView,settings:settingsView};main.innerHTML=(views[S.view]||overviewView)();bindView()}
    function empty(title,text,action,fn){setTimeout(()=>{const b=$('.empty-action');if(b)b.onclick=fn},0);return `<div class="card empty"><strong>${esc(title)}</strong><span>${esc(text)}</span>${action?`<div style="margin-top:15px"><button class="btn primary small empty-action">${esc(action)}</button></div>`:''}</div>`}
    function pageHead(title,text,tools=''){return `<div class="view-head"><div><h2>${esc(title)}</h2><p>${esc(text)}</p></div><div class="toolbar">${tools}</div></div>`}
    function overviewView(){const open=q('tasks').filter(x=>x.status!=='done'&&x.status!=='cancelled'),pending=q('approvals').filter(x=>x.status==='pending'),events=q('events').filter(x=>new Date(x.start_at)>new Date()).slice(0,4),latest=q('updates').slice(0,4),project=q('projects')[0];return `${S.admin?pageHead('Painel do estúdio','Visão direta do cliente selecionado. Troque de cliente no topo para trabalhar em outra conta.'):''}<section class="context-hero"><span class="eyebrow" style="color:#ffd0a6">Espaço de acompanhamento</span><h2>${esc(S.client.name)}</h2><p>${esc(S.client.greeting)}</p><div class="hero-actions">${S.admin?'<button class="btn primary small" data-open="client">Editar identidade</button>':'<button class="btn primary small" data-nav="approvals">Ver o que precisa da sua resposta</button>'}<button class="btn line small" style="color:#fff;border-color:rgba(255,255,255,.34)" data-nav="calendar">Abrir agenda</button></div></section><section class="metric-grid"><article class="metric"><p>Projetos em movimento</p><strong>${q('projects').filter(x=>!['delivered','paused'].includes(x.status)).length}</strong></article><article class="metric teal"><p>Próximas ações</p><strong>${open.length}</strong></article><article class="metric"><p>Aprovações abertas</p><strong>${pending.length}</strong></article><article class="metric teal"><p>Atualizações</p><strong>${latest.length}</strong></article></section><section class="section-grid"><article class="card"><div class="card-head"><div><h3>Onde estamos</h3><p class="card-sub">Projeto e próximo movimento.</p></div>${project?pill(project.status):''}</div>${project?`<strong>${esc(project.title)}</strong><p class="card-sub">${esc(project.next_step||project.description||'O estúdio está preparando os próximos passos.')}</p><div class="progress"><span style="width:${project.progress}%"></span></div><span class="card-sub">${project.progress}% concluído</span>`:empty('Nenhum projeto publicado','Quando o projeto for criado, o andamento aparece aqui.')}</article><article class="card"><div class="card-head"><div><h3>Agenda em foco</h3><p class="card-sub">Datas que merecem atenção.</p></div><button class="btn soft small" data-nav="calendar">Ver agenda</button></div>${events.length?`<div class="list">${events.map(e=>`<div class="list-row"><div><strong>${esc(e.title)}</strong><span>${fmtDateTime(e.start_at)} · ${stateLabel(e.category)}</span></div>${pill(e.category)}</div>`).join('')}</div>`:empty('Nenhuma data publicada','O próximo compromisso aparecerá aqui.')}</article><article class="card"><div class="card-head"><div><h3>${S.admin?'Ações pendentes':'O que precisa acontecer'}</h3><p class="card-sub">Itens que mantêm o projeto fluindo.</p></div><button class="btn soft small" data-nav="tasks">Abrir ações</button></div>${open.length?`<div class="list">${open.slice(0,4).map(t=>`<div class="list-row"><div><strong>${esc(t.title)}</strong><span>${t.due_date?'Prazo '+fmtDate(t.due_date):'Sem prazo'} · ${stateLabel(t.assigned_to)}</span></div>${pill(t.priority)}</div>`).join('')}</div>`:empty('Nenhuma ação pendente','Tudo organizado por aqui.')}</article><article class="card"><div class="card-head"><div><h3>Atualizações do estúdio</h3><p class="card-sub">O que avançou e o que vem agora.</p></div><button class="btn soft small" data-nav="updates">Histórico</button></div>${latest.length?`<div class="timeline">${latest.map(u=>`<div class="timeline-item"><strong>${esc(u.title)}</strong><p>${esc(u.body)}</p><time>${fmtDateTime(u.created_at)}</time></div>`).join('')}</div>`:empty('Ainda não há atualizações','Marcos e bastidores publicados pelo estúdio aparecem aqui.')}</article></section>`}
    function clientsView(){const rows=visibleData('clients');return `${pageHead('Clientes','Crie portais, personalize a identidade e abra a área de trabalho de cada cliente.','<input class="search" id="view-search" placeholder="Buscar cliente" />')}<div class="card table-wrap">${rows.length?`<table class="data-table"><thead><tr><th>Cliente</th><th>URL exclusiva</th><th>Situação</th><th>Acesso</th><th></th></tr></thead><tbody>${rows.map(c=>{const count=(S.client?.id===c.id?q('members'):[]).length;return `<tr><td><strong>${esc(c.name)}</strong><br><span>${esc(c.contact_name||'Sem contato principal')}</span></td><td><code>?client=${esc(c.slug)}</code></td><td>${pill(c.status)}</td><td>${count||'0'} conta(s)</td><td><div class="row-actions"><button class="btn soft small" data-open-client="${c.id}">Abrir</button><button class="btn line small" data-edit-client="${c.id}">Editar</button></div></td></tr>`}).join('')}</tbody></table>`:empty('Sua carteira está pronta para começar','Crie o primeiro cliente e gere uma URL exclusiva para ele.','Criar cliente',()=>clientModal())}</div>`}
    function accountsView(){const accounts=visibleData('accounts');return `${pageHead('Contas','Crie os usuários primeiro. Depois, vincule cada conta ao portal de um cliente em Acesso ao site.','<input class="search" id="view-search" placeholder="Buscar conta" />')}<div class="notice">As credenciais ficam no Supabase Auth. O Portal mostra somente usuário, nome, situação e vínculo. Senhas nunca ficam salvas aqui.</div><div class="card table-wrap" style="margin-top:15px">${accounts.length?`<table class="data-table"><thead><tr><th>Conta</th><th>Papel</th><th>Situação</th><th>Último acesso</th><th></th></tr></thead><tbody>${accounts.map(a=>`<tr><td><strong>${esc(a.full_name||a.username)}</strong><br><span>@${esc(a.username)}</span></td><td>${pill(a.role)}</td><td>${pill(a.status)}</td><td>${a.last_seen_at?fmtDateTime(a.last_seen_at):'Ainda não entrou'}</td><td><div class="row-actions"><button class="btn line small" data-edit-account="${a.id}">Gerir</button></div></td></tr>`).join('')}</tbody></table>`:empty('Nenhuma conta criada','Crie uma conta de cliente e depois libere o acesso ao portal dele.','Criar conta',()=>accountModal())}</div>`}
    function projectsView(){const projects=visibleData('projects');return `${pageHead('Projetos','Escopo, andamento, etapas e próximo passo em uma visão objetiva.','<input class="search" id="view-search" placeholder="Buscar projeto" />')}<div class="split">${projects.length?projects.map(p=>`<article class="card"><div class="card-head"><div><h3>${esc(p.title)}</h3><p class="card-sub">Entrega ${p.due_date?fmtDate(p.due_date):'sem data definida'}</p></div>${pill(p.status)}</div><p class="card-sub">${esc(p.description||'Sem descrição detalhada.')}</p><div class="progress"><span style="width:${p.progress}%"></span></div><div class="list-row"><span>${p.progress}% concluído</span><strong>${esc(p.next_step||'Próximo passo ainda não definido')}</strong></div><div class="stage-list">${q('stages').filter(s=>s.project_id===p.id).map(s=>`<div class="stage ${s.status}"><i class="stage-dot"></i><div><strong>${esc(s.title)}</strong><p>${esc(s.note)}</p></div></div>`).join('')||'<p class="card-sub">Adicione etapas para tornar o processo visível.</p>'}</div><div style="margin-top:13px">${S.admin?`<button class="btn soft small" data-project-stages="${p.id}">Editar etapas</button>`:''}</div></article>`).join(''):empty('Nenhum projeto criado','Crie um projeto e mostre o caminho de trabalho para o cliente.','Criar projeto',()=>projectModal())}</div>`}
    function calendarView(){const m=S.month,y=m.getFullYear(),mo=m.getMonth(),first=new Date(y,mo,1),start=new Date(y,mo,1-first.getDay()),days=Array.from({length:42},(_,i)=>new Date(start.getFullYear(),start.getMonth(),start.getDate()+i));const events=visibleData('events');return `${pageHead('Agenda','Calendário mensal com categorias, entregas, reuniões, publicações e revisões.','<select id="event-filter" class="filter"><option value="">Todas as categorias</option><option value="meeting">Reuniões</option><option value="delivery">Entregas</option><option value="post">Publicações</option><option value="review">Revisões</option></select>')}<section class="card"><div class="cal-top"><button class="btn line small" data-month="-1">‹ Mês anterior</button><strong class="cal-title">${new Intl.DateTimeFormat('pt-BR',{month:'long',year:'numeric'}).format(m)}</strong><button class="btn line small" data-month="1">Próximo mês ›</button></div><div class="calendar">${['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'].map(x=>`<div class="cal-weekday">${x}</div>`).join('')}${days.map(d=>{const same=d.getMonth()===mo,today=d.toDateString()===new Date().toDateString(), ev=events.filter(e=>new Date(e.start_at).toDateString()===d.toDateString());return `<div class="cal-day ${same?'':'other'} ${today?'today':''}"><span class="day-no">${d.getDate()}</span>${ev.map(e=>`<button class="cal-event ${e.category}" data-event="${e.id}" title="${esc(e.title)}">${esc(e.title)}</button>`).join('')}</div>`}).join('')}</div></section><section class="card" style="margin-top:15px"><div class="card-head"><div><h3>Próximas datas</h3><p class="card-sub">Lista filtrável da agenda do cliente.</p></div></div>${events.filter(e=>new Date(e.start_at)>=new Date()).slice(0,10).map(e=>`<div class="list-row"><div><strong>${esc(e.title)}</strong><span>${fmtDateTime(e.start_at)} · ${esc(e.description||stateLabel(e.category))}</span></div>${pill(e.category)}</div>`).join('')||empty('Nenhuma data cadastrada','Use Criar para publicar uma entrega, reunião ou conteúdo.')}</section>`}
    function tasksView(){const groups=[['open','Para iniciar'],['in_progress','Em andamento'],['done','Concluídas'],['cancelled','Canceladas']];return `${pageHead('Ações','Tarefas com prioridade, prazo, responsável e andamento.','<input class="search" id="view-search" placeholder="Buscar ação" />')}<section class="kanban">${groups.map(([status,label])=>`<div class="kanban-col"><h4>${label} · ${visibleData('tasks').filter(t=>t.status===status).length}</h4>${visibleData('tasks').filter(t=>t.status===status).map(t=>`<article class="task-card"><strong>${esc(t.title)}</strong><p>${esc(t.description||'Sem detalhes adicionais.')}</p><div class="list-row"><span>${t.due_date?fmtDate(t.due_date):'Sem prazo'}</span>${pill(t.priority)}</div>${S.admin?`<button class="btn soft small" data-edit-task="${t.id}">Editar</button>`:''}</article>`).join('')||'<p class="card-sub" style="padding:6px">Nada aqui.</p>'}</div>`).join('')}</section>`}
    function approvalsView(){const items=visibleData('approvals');return `${pageHead('Aprovações','Cada retorno fica registrado com versão, prazo e decisão.','<select id="approval-filter" class="filter"><option value="">Todas</option><option value="pending">Aguardando</option><option value="approved">Aprovadas</option><option value="changes_requested">Ajustes pedidos</option></select>')}<section class="card">${items.length?items.map(a=>`<article class="approval-card"><div class="approval-preview">${esc(a.version_label)}</div><div><div class="card-head"><div><h4>${esc(a.title)}</h4><p>${esc(a.description||'Material enviado para decisão.')}</p></div>${pill(a.status)}</div><span class="card-sub">${a.due_date?'Retorno até '+fmtDate(a.due_date):'Sem prazo definido'} · ${esc(a.version_label)}</span>${a.decision_note?`<p class="notice">${esc(a.decision_note)}</p>`:''}<div class="material-actions" style="margin-top:10px">${a.status==='pending'&&!S.admin?`<button class="btn primary small" data-approve="${a.id}">Aprovar</button><button class="btn line small" data-request-changes="${a.id}">Pedir ajustes</button>`:''}${S.admin?`<button class="btn soft small" data-edit-approval="${a.id}">Editar</button>`:''}</div></div></article>`).join(''):empty('Nada aguardando aprovação','Quando o estúdio enviar um material, ele aparecerá aqui.','Criar aprovação',()=>approvalModal())}</section>`}
    function materialsView(){const materials=visibleData('materials');return `${pageHead('Materiais','Arquivos, prévias, versões e liberação comercial por pagamento.','<input class="search" id="view-search" placeholder="Buscar material" />')}<section class="material-grid">${materials.length?materials.map(m=>`<article class="material"><div class="material-preview ${m.commercial_status==='awaiting_payment'?'locked protected-preview':''}" oncontextmenu="return false">${m.preview_url?`<img src="${esc(m.preview_url)}" alt="Prévia de ${esc(m.title)}">`:'<span>RMS</span>'}</div><div class="material-copy"><div class="card-head"><div><h4>${esc(m.title)}</h4><p>${esc(m.folder)} · ${esc(m.version_label)}</p></div>${pill(m.commercial_status)}</div>${m.commercial_status==='awaiting_payment'?`<p>${m.price_cents?money(m.price_cents):'Valor combinado'} · ${esc(m.payment_message||'Após a confirmação, o material será liberado.')}</p>`:m.commercial_status==='restricted'?'<p>Este material ainda não está disponível para acesso.</p>':'<p>Material liberado para download.</p>'}<div class="material-actions">${m.commercial_status==='released'?`<button class="btn primary small" data-download="${m.id}">Baixar arquivo</button>`:''}${m.commercial_status==='awaiting_payment'&&!S.admin?`<button class="btn primary small" data-payment="${m.id}">Informar pagamento</button>`:''}${S.admin?`<button class="btn soft small" data-edit-material="${m.id}">Gerir</button>`:''}</div></div></article>`).join(''):empty('Nenhum material publicado','Envie arquivos, escolha a visibilidade e libere quando quiser.','Adicionar material',()=>materialModal())}</section>`}
    function updatesView(){const list=visibleData('updates');return `${pageHead('Atualizações','Marcos, bastidores e check-ins para manter a parceria viva.','<input class="search" id="view-search" placeholder="Buscar atualização" />')}<section class="card"><div class="timeline">${list.length?list.map(u=>`<article class="timeline-item"><div class="card-head"><div><strong>${esc(u.title)}</strong><p>${esc(u.body)}</p><time>${fmtDateTime(u.created_at)} · ${stateLabel(u.type)}</time></div>${pill(u.type)}</div></article>`).join(''):empty('O projeto ainda não recebeu atualizações','Publique um marco, check-in ou bastidor para preencher esta linha do tempo.','Nova atualização',()=>updateModal())}</div></section>`}
    function reportsView(){const p=q('projects'),t=q('tasks'),a=q('approvals');const done=t.filter(x=>x.status==='done').length;return `${pageHead('Resumo do projeto','Uma leitura rápida de andamento, decisões e entregas.')}<div class="metric-grid"><article class="metric"><p>Projetos</p><strong>${p.length}</strong></article><article class="metric teal"><p>Ações concluídas</p><strong>${done}/${t.length}</strong></article><article class="metric"><p>Aprovações</p><strong>${a.filter(x=>x.status==='approved').length}/${a.length}</strong></article><article class="metric teal"><p>Materiais liberados</p><strong>${q('materials').filter(x=>x.commercial_status==='released').length}</strong></article></div><section class="card"><div class="card-head"><div><h3>Resumo pronto para compartilhar</h3><p class="card-sub">Use a impressão do navegador para salvar este painel como PDF.</p></div><button class="btn dark small" onclick="window.print()">Imprimir resumo</button></div><div class="split"><div><strong>Em movimento</strong>${p.map(x=>`<div class="list-row"><span>${esc(x.title)}</span>${pill(x.status)}</div>`).join('')||'<p class="card-sub">Ainda não há projeto.</p>'}</div><div><strong>Próximas decisões</strong>${a.filter(x=>x.status==='pending').map(x=>`<div class="list-row"><span>${esc(x.title)}</span>${x.due_date?fmtDate(x.due_date):'Sem prazo'}</div>`).join('')||'<p class="card-sub">Nenhuma aprovação em aberto.</p>'}</div></div></section>`}
    function settingsView(){if(!S.admin)return overviewView();return `${pageHead('Personalização do portal','Ajuste o portal selecionado sem alterar a estrutura de outros clientes.')}<section class="setting-grid"><form id="brand-form" class="card"><div class="card-head"><div><h3>Identidade do cliente</h3><p class="card-sub">Nome, mensagem, cores e presença visual.</p></div></div><div class="field"><label>Nome exibido</label><input name="name" value="${esc(S.client.name)}" required></div><div class="field"><label>Mensagem de entrada</label><textarea name="greeting">${esc(S.client.greeting)}</textarea></div><div class="field"><label>Texto de apoio</label><textarea name="intro">${esc(S.client.intro)}</textarea></div><div class="form-grid"><div class="field"><label>Cor de ação</label><input class="color-input" name="accent_color" type="color" value="${esc(S.client.accent_color||'#f97316')}"></div><div class="field"><label>Cor estrutural</label><input class="color-input" name="structure_color" type="color" value="${esc(S.client.structure_color||'#1f3950')}"></div></div><button class="btn primary" type="submit">Salvar identidade</button></form><section class="card"><div class="card-head"><div><h3>Acesso ao site</h3><p class="card-sub">Vincule uma conta já criada, suspenda ou remova seu acesso a este portal.</p></div><button class="btn primary small" id="link-account">Vincular conta</button></div>${q('members').length?`<div class="list">${q('members').map(m=>{const a=q('accounts').find(x=>x.id===m.profile_id)||{};return `<div class="list-row"><div><strong>${esc(a.full_name||a.username||'Conta')}</strong><span>@${esc(a.username||'')} · ${stateLabel(m.access_role)}</span></div><div class="row-actions">${pill(m.status)}<button class="btn line small" data-member="${m.id}">Gerir</button></div></div>`}).join('')}</div>`:empty('Nenhuma conta vinculada','Crie a conta na Central de Contas e vincule-a aqui.')}</section></section>`}
    function bindView(){
      document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>{S.view=b.dataset.nav;renderShell()});
      document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>clientModal(S.client));
      $('#view-search')?.addEventListener('input',e=>{S.search=e.target.value;renderView()});
      $('#event-filter')?.addEventListener('change',e=>{S.search=e.target.value;renderView()});$('#approval-filter')?.addEventListener('change',e=>{S.search=e.target.value;renderView()});
      document.querySelectorAll('[data-month]').forEach(b=>b.onclick=()=>{S.month=new Date(S.month.getFullYear(),S.month.getMonth()+Number(b.dataset.month),1);renderView()});
      document.querySelectorAll('[data-open-client]').forEach(b=>b.onclick=async()=>{S.client=S.clients.find(c=>c.id===b.dataset.openClient);await loadClientData(S.client.id);S.view='overview';renderShell()});
      document.querySelectorAll('[data-edit-client]').forEach(b=>b.onclick=()=>clientModal(S.clients.find(c=>c.id===b.dataset.editClient)));
      document.querySelectorAll('[data-edit-account]').forEach(b=>b.onclick=()=>accountModal(q('accounts').find(a=>a.id===b.dataset.editAccount)));
      document.querySelectorAll('[data-edit-task]').forEach(b=>b.onclick=()=>taskModal(q('tasks').find(x=>x.id===b.dataset.editTask)));
      document.querySelectorAll('[data-edit-approval]').forEach(b=>b.onclick=()=>approvalModal(q('approvals').find(x=>x.id===b.dataset.editApproval)));
      document.querySelectorAll('[data-edit-material]').forEach(b=>b.onclick=()=>materialModal(q('materials').find(x=>x.id===b.dataset.editMaterial)));
      document.querySelectorAll('[data-approve]').forEach(b=>b.onclick=()=>approvalDecision(b.dataset.approve,'approved'));
      document.querySelectorAll('[data-request-changes]').forEach(b=>b.onclick=()=>approvalDecision(b.dataset.requestChanges,'changes_requested'));
      document.querySelectorAll('[data-payment]').forEach(b=>b.onclick=()=>paymentModal(b.dataset.payment));
      document.querySelectorAll('[data-download]').forEach(b=>b.onclick=()=>downloadMaterial(b.dataset.download));
      document.querySelectorAll('[data-member]').forEach(b=>b.onclick=()=>memberModal(q('members').find(x=>x.id===b.dataset.member)));
      $('#brand-form')?.addEventListener('submit',saveBrand);$('#link-account')?.addEventListener('click',linkAccountModal);
    }
    function modal(title,body,submitLabel='Salvar',onSubmit=null){$('#modal-root').innerHTML=`<div class="modal-backdrop" id="backdrop"><form class="modal" id="modal-form"><div class="modal-head"><h3>${esc(title)}</h3><button class="icon-btn" type="button" id="close-modal">×</button></div>${body}<div class="modal-foot"><button type="button" class="btn line" id="cancel-modal">Cancelar</button>${submitLabel?`<button class="btn primary" type="submit">${esc(submitLabel)}</button>`:''}</div></form></div>`;const close=()=>{$('#modal-root').innerHTML=''};$('#close-modal').onclick=close;$('#cancel-modal').onclick=close;$('#backdrop').onclick=e=>{if(e.target.id==='backdrop')close()};if(onSubmit)$('#modal-form').onsubmit=async e=>{e.preventDefault();await onSubmit(new FormData(e.target),close)}}
    function field(n,l,v='',type='text',extra=''){if(type==='textarea')return `<div class="field ${extra}"><label>${l}</label><textarea name="${n}">${esc(v)}</textarea></div>`;return `<div class="field ${extra}"><label>${l}</label><input name="${n}" type="${type}" value="${esc(v)}"></div>`}
    function select(n,l,items,v='',extra=''){return `<div class="field ${extra}"><label>${l}</label><select name="${n}">${items.map(([x,t])=>`<option value="${x}" ${x===v?'selected':''}>${t}</option>`).join('')}</select></div>`}
    async function submitTable(table,id,data,close){const query=id?db.from(table).update(data).eq('id',id):db.from(table).insert(data);const {error}=await query;if(error){toast(error.message);return}close();await loadClientData(S.client.id);renderShell();toast('Alteração salva')}
    function clientModal(c=null){modal(c?'Editar cliente':'Criar cliente',`<div class="form-grid">${field('name','Nome do cliente',c?.name||'','text','full')}${field('slug','URL curta',c?.slug||'','text','full')}${field('contact_name','Nome de contato',c?.contact_name||'')}${field('contact_email','E-mail de contato',c?.contact_email||'email')}${select('status','Situação',[['active','Ativo'],['paused','Pausado'],['archived','Arquivado']],c?.status||'active')}</div><p class="form-note">A URL será aberta como <strong>?client=nome-do-cliente</strong>.</p>`,c?'Salvar cliente':'Criar cliente',async(f,close)=>{let slug=String(f.get('slug')||f.get('name')).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'');await submitTable('portal_clients',c?.id,{name:f.get('name'),slug,contact_name:f.get('contact_name'),contact_email:f.get('contact_email'),status:f.get('status')},close)})}
    function accountModal(a=null){if(!S.admin)return;const body=a?`<div class="form-grid">${field('full_name','Nome completo',a.full_name,'text','full')}${field('username','Nome de usuário',a.username)}${select('status','Situação',[['active','Ativa'],['blocked','Bloqueada']],a.status)}${field('password','Nova senha opcional','','password','full')}</div><p class="form-note">A senha é atualizada no Supabase Auth e nunca fica visível depois de salva.</p>`:`<div class="form-grid">${field('full_name','Nome completo','','text','full')}${field('username','Nome de usuário')}${field('password','Senha inicial','','password')}</div><p class="form-note">O cliente entra com usuário e senha. O e-mail técnico é criado internamente e não aparece para ele.</p>`;modal(a?'Gerir conta':'Criar conta',body,a?'Salvar conta':'Criar conta',async(f,close)=>{const payload=a?{action:'update',profileId:a.id,fullName:f.get('full_name'),username:f.get('username'),status:f.get('status'),password:f.get('password')}:{action:'create',fullName:f.get('full_name'),username:f.get('username'),password:f.get('password')};const {data,error}=await db.functions.invoke('manage-portal-accounts',{body:payload});if(error||data?.error){toast(data?.error||error.message);return}close();await loadClientData(S.client.id);renderShell();toast(a?'Conta atualizada':'Conta criada. Agora vincule-a ao cliente.')})}
    function projectModal(p=null){modal(p?'Editar projeto':'Criar projeto',`<div class="form-grid">${field('title','Título',p?.title||'','text','full')}${field('description','Contexto',p?.description||'','textarea','full')}${select('status','Situação',[['planning','Planejamento'],['active','Em movimento'],['review','Em revisão'],['delivered','Entregue'],['paused','Pausado']],p?.status||'planning')}${field('progress','Andamento em %',p?.progress??0,'number')}${field('start_date','Início',p?.start_date||'','date')}${field('due_date','Prazo',p?.due_date||'','date')}${field('next_step','Próximo passo',p?.next_step||'','text','full')}</div>`,p?'Salvar projeto':'Criar projeto',async(f,close)=>submitTable('portal_projects',p?.id,{client_id:S.client.id,title:f.get('title'),description:f.get('description'),status:f.get('status'),progress:Number(f.get('progress')||0),start_date:f.get('start_date')||null,due_date:f.get('due_date')||null,next_step:f.get('next_step')},close))}
    function eventModal(e=null){modal(e?'Editar evento':'Criar evento',`<div class="form-grid">${field('title','Título',e?.title||'','text','full')}${field('description','Descrição',e?.description||'','textarea','full')}${select('category','Categoria',[['meeting','Reunião'],['delivery','Entrega'],['post','Publicação'],['review','Revisão'],['reminder','Lembrete'],['other','Outro']],e?.category||'meeting')}${field('start_at','Data e horário',e?.start_at?e.start_at.slice(0,16):'','datetime-local')}${field('end_at','Término opcional',e?.end_at?e.end_at.slice(0,16):'','datetime-local')}${select('publish_to_client','Visível para cliente',[['true','Sim'],['false','Não']],String(e?.publish_to_client??true))}</div>`,e?'Salvar evento':'Publicar evento',async(f,close)=>submitTable('portal_events',e?.id,{client_id:S.client.id,title:f.get('title'),description:f.get('description'),category:f.get('category'),start_at:new Date(f.get('start_at')).toISOString(),end_at:f.get('end_at')?new Date(f.get('end_at')).toISOString():null,publish_to_client:f.get('publish_to_client')==='true'},close))}
    function taskModal(t=null){modal(t?'Editar ação':'Criar ação',`<div class="form-grid">${field('title','Ação',t?.title||'','text','full')}${field('description','Detalhes',t?.description||'','textarea','full')}${select('status','Andamento',[['open','Para iniciar'],['in_progress','Em andamento'],['done','Concluída'],['cancelled','Cancelada']],t?.status||'open')}${select('priority','Prioridade',[['low','Baixa'],['normal','Normal'],['high','Alta'],['urgent','Urgente']],t?.priority||'normal')}${field('due_date','Prazo',t?.due_date||'','date')}${select('assigned_to','Responsável',[['studio','Estúdio'],['client','Cliente'],['shared','Compartilhada']],t?.assigned_to||'studio')}</div>`,t?'Salvar ação':'Criar ação',async(f,close)=>submitTable('portal_tasks',t?.id,{client_id:S.client.id,title:f.get('title'),description:f.get('description'),status:f.get('status'),priority:f.get('priority'),due_date:f.get('due_date')||null,assigned_to:f.get('assigned_to'),visible_to_client:true},close))}
    function approvalModal(a=null){modal(a?'Editar aprovação':'Criar aprovação',`<div class="form-grid">${field('title','Material',a?.title||'','text','full')}${field('description','Orientação para o cliente',a?.description||'','textarea','full')}${field('version_label','Versão',a?.version_label||'V1')}${field('due_date','Prazo de retorno',a?.due_date||'','date')}</div>`,a?'Salvar aprovação':'Publicar para aprovação',async(f,close)=>submitTable('portal_approvals',a?.id,{client_id:S.client.id,title:f.get('title'),description:f.get('description'),version_label:f.get('version_label'),due_date:f.get('due_date')||null,status:a?.status||'pending'},close))}
    function updateModal(){modal('Publicar atualização',`<div class="form-grid">${field('title','Título','','text','full')}${field('body','Mensagem','','textarea','full')}${select('type','Tipo',[['update','Atualização'],['milestone','Marco'],['behind_the_scenes','Bastidor'],['check_in','Check-in'],['celebration','Conquista']])}</div>`,'Publicar',async(f,close)=>submitTable('portal_updates',null,{client_id:S.client.id,title:f.get('title'),body:f.get('body'),type:f.get('type'),published:true},close))}
    function materialModal(m=null){const existing=m?`<p class="notice">Use uma prévia exportada com marca d'água caso o material fique aguardando pagamento. O original continua privado no bucket.</p>`:'';modal(m?'Gerir material':'Adicionar material',`${existing}<div class="form-grid">${field('title','Título',m?.title||'','text','full')}${field('description','Descrição',m?.description||'','textarea','full')}${field('folder','Pasta',m?.folder||'Entregas')}${field('version_label','Versão',m?.version_label||'V1')}${select('commercial_status','Liberação comercial',[['released','Liberado'],['awaiting_payment','Aguardando pagamento'],['restricted','Restrito']],m?.commercial_status||'released')}${field('price','Valor em reais',m?.price_cents?String(m.price_cents/100):'','number')}${field('payment_message','Mensagem de pagamento',m?.payment_message||'','text','full')}${!m?`<div class="field full"><label>Arquivo original</label><input name="original" type="file" required></div><div class="field full"><label>Prévia com marca d'água opcional</label><input name="preview" type="file" accept="image/*,application/pdf"></div>`:''}</div>`,m?'Salvar material':'Enviar material',async(f,close)=>{let filePath=m?.file_path,previewPath=m?.preview_path,fileName=m?.file_name,mime=m?.mime_type,size=m?.size_bytes;const original=f.get('original');if(original instanceof File&&original.size){const path=`${S.client.id}/originais/${crypto.randomUUID()}-${original.name.replace(/[^a-zA-Z0-9._-]/g,'_')}`;const {error}=await db.storage.from('portal-materials').upload(path,original,{upsert:false});if(error){toast(error.message);return}filePath=path;fileName=original.name;mime=original.type;size=original.size}const preview=f.get('preview');if(preview instanceof File&&preview.size){const path=`${S.client.id}/previas/${crypto.randomUUID()}-${preview.name.replace(/[^a-zA-Z0-9._-]/g,'_')}`;const {error}=await db.storage.from('portal-materials').upload(path,preview,{upsert:false});if(error){toast(error.message);return}previewPath=path}if(!filePath){toast('Envie o arquivo original');return}await submitTable('portal_materials',m?.id,{client_id:S.client.id,title:f.get('title'),description:f.get('description'),folder:f.get('folder'),version_label:f.get('version_label'),commercial_status:f.get('commercial_status'),price_cents:f.get('price')?Math.round(Number(f.get('price'))*100):null,payment_message:f.get('payment_message'),file_path:filePath,preview_path:previewPath,file_name:fileName,mime_type:mime,size_bytes:size,published:true},close)})}
    function paymentModal(id){modal('Informar pagamento',`${field('note','Mensagem para o estúdio','','textarea','full')}<p class="form-note">Envie o comprovante pelo canal combinado com o estúdio. Após conferência, o download será liberado aqui.</p>`,'Informar pagamento',async(f,close)=>{const {error}=await db.rpc('portal_mark_payment_sent',{material_id:id,note:f.get('note')});if(error){toast(error.message);return}close();await loadClientData(S.client.id);renderShell();toast('Pagamento informado. O estúdio será avisado.')})}
    async function approvalDecision(id,decision){let note='';if(decision==='changes_requested')note=prompt('Explique o ajuste desejado:')||'';const {error}=await db.rpc('portal_reply_approval',{approval_id:id,decision,note});if(error){toast(error.message);return}await loadClientData(S.client.id);renderShell();toast(decision==='approved'?'Aprovação registrada.':'Pedido de ajuste enviado.')}
    async function downloadMaterial(id){const material=q('materials').find(x=>x.id===id);if(!material)return;const {data,error}=await db.storage.from('portal-materials').createSignedUrl(material.file_path,60);if(error){toast('O download ainda não está liberado.');return}window.open(data.signedUrl,'_blank','noopener')}
    function linkAccountModal(){const available=q('accounts').filter(a=>a.role==='client');modal('Vincular conta ao cliente',`${select('profile_id','Conta disponível',available.map(a=>[a.id,`${a.full_name||a.username} (@${a.username})`]))}${select('access_role','Nível de acesso',[['client','Cliente'],['viewer','Somente leitura']])}`,'Liberar acesso',async(f,close)=>{const {error}=await db.from('portal_client_members').upsert({client_id:S.client.id,profile_id:f.get('profile_id'),access_role:f.get('access_role'),status:'active'},{onConflict:'client_id,profile_id'});if(error){toast(error.message);return}close();await loadClientData(S.client.id);renderShell();toast('Conta vinculada ao portal.')})}
    function memberModal(m){const a=q('accounts').find(x=>x.id===m.profile_id)||{};modal('Gerir acesso',`<p class="notice">${esc(a.full_name||a.username)} usa a conta @${esc(a.username)} para entrar neste portal.</p>${select('status','Acesso',[['active','Liberado'],['suspended','Suspenso']],m.status)}${select('access_role','Nível de acesso',[['client','Cliente'],['viewer','Somente leitura']],m.access_role)}`,'Salvar acesso',async(f,close)=>{const {error}=await db.from('portal_client_members').update({status:f.get('status'),access_role:f.get('access_role')}).eq('id',m.id);if(error){toast(error.message);return}close();await loadClientData(S.client.id);renderShell();toast('Acesso atualizado.')})}
