  <style>
    :root{--ink:#1d3346;--muted:#607080;--paper:#f7f2e9;--glass:rgba(255,255,255,.72);--line:rgba(31,57,80,.13);--orange:#f97316;--blue:#1f3950;--teal:#167a83;--green:#268353;--red:#b94740;--radius:24px;font-family:DM Sans,ui-sans-serif,system-ui,sans-serif;color:var(--ink)}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 7% 2%,rgba(249,115,22,.18),transparent 27rem),radial-gradient(circle at 96% 20%,rgba(22,122,131,.15),transparent 30rem),var(--paper)}button,input,textarea,select{font:inherit}button{cursor:pointer}.app{max-width:1420px;margin:auto;padding:20px}.shell{display:grid;grid-template-columns:246px 1fr;gap:18px;min-height:calc(100vh - 40px)}.side,.card{background:var(--glass);border:1px solid var(--line);box-shadow:0 18px 50px rgba(24,45,61,.1);backdrop-filter:blur(22px)}.side{border-radius:28px;padding:16px;display:flex;flex-direction:column;gap:18px}.brand{display:flex;align-items:center;gap:10px;color:inherit;text-decoration:none;padding:6px}.mark{width:43px;height:43px;display:grid;place-items:center;border-radius:15px;background:linear-gradient(145deg,#fb7c1e,#ffa840);color:white;font-weight:900;letter-spacing:-.08em;box-shadow:inset 0 1px 0 rgba(255,255,255,.45)}.brand b{display:block;font-family:Inter Tight,sans-serif;letter-spacing:-.05em;font-size:17px}.brand small{display:block;color:var(--muted);font-size:11px}.nav{display:grid;gap:6px}.nav button{border:0;background:transparent;color:var(--muted);font-weight:800;text-align:left;padding:11px 12px;border-radius:13px}.nav button:hover,.nav button.active{background:rgba(249,115,22,.13);color:var(--ink)}.foot{margin-top:auto;padding:10px 6px;color:var(--muted);font-size:11px;line-height:1.45;border-top:1px solid var(--line)}.top{display:flex;justify-content:space-between;gap:14px;align-items:center;margin:3px 4px 18px}.eyebrow{color:var(--orange);font-size:10px;font-weight:900;letter-spacing:.13em;text-transform:uppercase}.top h1{font-family:Inter Tight,sans-serif;font-size:clamp(27px,4vw,41px);letter-spacing:-.065em;margin:3px 0}.user{display:flex;gap:9px;align-items:center}.avatar{width:37px;height:37px;border-radius:50%;display:grid;place-items:center;color:#fff;background:var(--blue);font-size:12px;font-weight:900}.button{background:var(--blue);color:white;border:0;border-radius:13px;padding:10px 13px;font-weight:850;transition:transform .16s ease}.button:hover{transform:translateY(-1px)}.button:active{transform:scale(.97)}.button.orange{background:var(--orange)}.button.ghost{background:rgba(255,255,255,.5);color:var(--ink);border:1px solid var(--line)}.button.small{font-size:11px;padding:8px 10px}.grid{display:grid;gap:16px}.metrics{grid-template-columns:repeat(4,1fr)}.two{grid-template-columns:repeat(2,minmax(0,1fr))}.card{border-radius:var(--radius);padding:20px}.metric{min-height:135px;overflow:hidden;position:relative}.metric:after{content:"";position:absolute;width:90px;height:90px;border-radius:50%;right:-23px;bottom:-30px;background:var(--bubble,rgba(249,115,22,.2))}.metric strong{display:block;font-family:Inter Tight,sans-serif;font-size:36px;letter-spacing:-.075em;margin-top:21px}.metric span,.meta{color:var(--muted);font-size:12px}.hero{background:linear-gradient(120deg,#1f3950,#305977);color:#fff;overflow:hidden;position:relative}.hero:after{content:"";position:absolute;right:-100px;top:-150px;width:300px;height:300px;border:1px solid rgba(255,255,255,.24);border-radius:50% 40% 60% 50%;transform:rotate(25deg)}.hero>*{position:relative;z-index:1}.hero p{color:rgba(255,255,255,.75);max-width:660px;line-height:1.5}.hero h2{font-family:Inter Tight,sans-serif;font-size:29px;letter-spacing:-.055em;margin:5px 0}.head{display:flex;justify-content:space-between;gap:10px;align-items:end;margin-bottom:13px}.head h2,.head h3{font-family:Inter Tight,sans-serif;letter-spacing:-.045em;margin:0}.head h2{font-size:22px}.head h3{font-size:18px}.head p{font-size:12px;color:var(--muted);margin:4px 0 0}.list{display:grid;gap:9px}.item{display:flex;gap:11px;align-items:flex-start;background:rgba(255,255,255,.45);border:1px solid var(--line);border-radius:16px;padding:12px}.dot{width:10px;height:10px;border-radius:50%;background:var(--item,var(--teal));margin-top:5px;flex:0 0 10px}.item main{min-width:0;flex:1}.title{margin:0;font-size:14px;font-weight:900}.tag{font-size:10px;font-weight:900;letter-spacing:.05em;text-transform:uppercase;padding:5px 8px;border-radius:99px;color:#09535a;background:rgba(22,122,131,.12);white-space:nowrap}.tag.wait{color:#a84b00;background:rgba(249,115,22,.14)}.tag.done{color:#1d6e45;background:rgba(38,131,83,.13)}.progress{height:7px;background:rgba(31,57,80,.1);border-radius:99px;overflow:hidden;margin-top:10px}.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--orange),#ffae42);border-radius:inherit}.form{display:grid;gap:10px}.form.two{grid-template-columns:repeat(2,minmax(0,1fr))}.field{display:grid;gap:5px}.field label{font-size:10px;font-weight:900;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}.field input,.field textarea,.field select{background:rgba(255,255,255,.76);border:1px solid var(--line);border-radius:11px;padding:10px;color:var(--ink);outline:none;width:100%}.field textarea{min-height:76px;resize:vertical}.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--orange);box-shadow:0 0 0 3px rgba(249,115,22,.12)}.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:4px}.notice{padding:12px 13px;border-radius:14px;color:#8d410a;background:rgba(249,115,22,.12);font-size:13px;line-height:1.45}.notice.error{color:#8c312a;background:rgba(185,71,64,.13)}.empty{text-align:center;padding:25px 10px;color:var(--muted);font-size:13px}.split{display:grid;grid-template-columns:minmax(220px,.7fr) minmax(0,1.3fr);gap:16px}.client{display:flex;gap:10px;align-items:center;padding:11px;border:1px solid var(--line);border-radius:15px;background:rgba(255,255,255,.4)}.client.active{border-color:var(--orange);box-shadow:0 0 0 3px rgba(249,115,22,.1)}.client-logo{width:42px;height:42px;display:grid;place-items:center;border-radius:14px;background:var(--accent,var(--orange));color:white;font-weight:900;overflow:hidden;flex:0 0 42px}.client-logo img{width:100%;height:100%;object-fit:cover}.client button{border:0;background:transparent;min-width:0;text-align:left;flex:1;color:var(--ink);font-weight:900}.login{min-height:100vh;display:grid;place-items:center;padding:20px}.login .card{width:min(470px,100%);padding:31px}.login h1{font-family:Inter Tight,sans-serif;font-size:39px;letter-spacing:-.07em;margin:17px 0 7px}.login p{color:var(--muted);line-height:1.5}.check{width:20px;height:20px;border:1px solid var(--line);border-radius:7px;background:#fff;display:grid;place-items:center;flex:0 0 20px;color:white;font-size:11px}.check.done{background:var(--green);border-color:var(--green)}.link{font-weight:900;color:var(--blue);text-decoration:none}.toast{position:fixed;right:18px;bottom:18px;z-index:20;transform:translateY(150%);background:var(--blue);color:white;padding:12px 14px;border-radius:13px;box-shadow:0 14px 35px rgba(0,0,0,.2);font-size:13px;font-weight:800;transition:transform .22s ease}.toast.show{transform:translateY(0)}.modal-wrap{position:fixed;inset:0;background:rgba(14,27,37,.45);z-index:10;display:grid;place-items:center;padding:20px}.modal{width:min(600px,100%);max-height:88vh;overflow:auto;background:var(--paper);padding:21px;border-radius:23px}.hidden{display:none!important}@media(max-width:900px){.shell{grid-template-columns:1fr}.side{border-radius:20px}.side .nav{display:flex;overflow:auto}.side .nav button{white-space:nowrap}.foot{display:none}.metrics{grid-template-columns:repeat(2,1fr)}.split{grid-template-columns:1fr}}@media(max-width:580px){.app{padding:10px}.shell{min-height:calc(100vh - 20px);gap:10px}.card{padding:16px;border-radius:19px}.top{align-items:flex-start}.top h1{font-size:29px}.metrics,.two,.form.two{grid-template-columns:1fr}.hero{padding:21px}.user .button{font-size:0;padding:10px}.user .button:after{content:'Sair';font-size:11px}.actions .button{flex:1}.split{gap:10px}}

<body><div id="app" class="app"></div><div id="toast" class="toast" role="status" aria-live="polite"></div>
<script>
/* RMS Portal: confirma a conta do estúdio antes da checagem administrativa legada. */
(() => {
  if (new URLSearchParams(location.search).get('mode') !== 'admin') return;
  const originalCreateClient = supabase.createClient.bind(supabase);
  supabase.createClient = (...args) => {
    const client = originalCreateClient(...args);
    const nativeRpc = client.rpc.bind(client);
    client.rpc = async (name, params, options) => {
      if (name !== 'is_portal_admin') return nativeRpc(name, params, options);
      const activation = await nativeRpc('activate_rms_portal_admin');
      const permission = await nativeRpc('is_portal_admin', params, options);
      window.__rmsPortalAdminDiagnostic = {
        activationError: activation.error?.message || null,
        activationResult: activation.data ?? null,
        permissionError: permission.error?.message || null,
        permissionResult: permission.data ?? null
      };
      return permission;
    };
    return client;
  };
})();
</script>
<script>
(()=>{const C={url:'https://wklmiuqqkdzufvkdzxff.supabase.co',key:'sb_publishable_yb9kOoPoQTs9YnzaoBcG6g_N4IwQHwG',bucket:'client-portal-files'};const db=supabase.createClient(C.url,C.key),root=document.querySelector('#app'),toastEl=document.querySelector('#toast'),P=new URLSearchParams(location.search),S={user:null,admin:false,mode:P.get('mode')==='admin'?'admin':'client',slug:P.get('client')||'',selected:null,tab:'visao',missing:new Set(),channel:null};const e=v=>String(v??'').replace(/[&<>'"]/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[x])),ini=v=>(v||'RMS').trim().slice(0,2).toUpperCase(),day=v=>v?new Intl.DateTimeFormat('pt-BR',{dateStyle:'medium'}).format(new Date(v)):'',when=v=>v?new Intl.DateTimeFormat('pt-BR',{dateStyle:'medium',timeStyle:'short'}).format(new Date(v)):'';function toast(t){toastEl.textContent=t;toastEl.className='toast show';clearTimeout(window.tt);window.tt=setTimeout(()=>toastEl.className='toast',3200)}function schema(err){return['42P01','PGRST205'].includes(err?.code)}async function get(n,q){let{data,error}=await q;if(error){if(schema(error)){S.missing.add(n);return[]}throw error}return data||[]}function base(){return location.pathname.replace(/index\.html$/,'')}function url(mode,slug){let x=base();return mode==='admin'?x+'?mode=admin':x+'?client='+encodeURIComponent(slug)}function shell(title,eyebrow,body,admin){return`<div class="shell"><aside class="side"><a class="brand" href="${base()}"><i class="mark">RMS</i><span><b>RMS Portal</b><small>${admin?'central do estúdio':'projeto em movimento'}</small></span></a><nav class="nav">${admin?['visao|Visão do estúdio','clientes|Clientes','conteudo|Conteúdo do cliente','marca|Marca e acesso'].map(x=>{let[a,b]=x.split('|');return`<button data-nav="${a}" class="${S.tab===a?'active':''}">${b}</button>`}).join(''):['Visão do projeto','Agenda','Ações','Aprovações','Materiais'].map((x,i)=>`<button class="${i?'':'active'}" data-scroll="${['','agenda','acoes','aprovar','materiais'][i]}">${x}</button>`).join('')}</nav><p class="foot">Dados protegidos por login e permissões do Supabase.<br><br>RMS Studio<br>Organização com contexto.</p></aside><main><header class="top"><div><div class="eyebrow">${e(eyebrow)}</div><h1>${e(title)}</h1></div><div class="user"><span class="avatar">${ini(S.user?.email)}</span><button class="button ghost small" data-out>Sair</button></div></header>${body}</main></div>`}function login(){root.innerHTML=`<main class="login"><section class="card"><i class="mark">RMS</i><div class="eyebrow" style="margin-top:18px">Portal do Cliente</div><h1>Seu projeto, sempre por perto.</h1><p>Entre para acompanhar o andamento, aprovar materiais e manter a próxima etapa clara.</p><div id="login-note"></div><form id="login" class="form"><div class="field"><label>E-mail</label><input name="email" type="email" required autocomplete="email" placeholder="voce@empresa.com"></div><div class="field"><label>Senha</label><input name="password" type="password" required autocomplete="current-password" placeholder="Sua senha"></div><button class="button orange">Entrar no portal</button></form><p class="meta">No primeiro acesso, use o convite enviado pelo estúdio para criar ou ativar sua conta.</p></section></main>`;document.querySelector('#login').onsubmit=async a=>{a.preventDefault();let f=new FormData(a.target),{error}=await db.auth.signInWithPassword({email:f.get('email'),password:f.get('password')});if(error){document.querySelector('#login-note').innerHTML=`<div class="notice error">${e(error.message)}</div>`;return}boot()}}async function boot(){let{data:{session}}=await db.auth.getSession();S.user=session?.user;if(!S.user)return login();let r=await db.rpc('is_portal_admin');S.admin=!r.error&&!!r.data;if(S.mode==='admin'){if(!S.admin){root.innerHTML='<main class="login"><section class="card"><div class="notice error">Esta conta não possui permissão para abrir o painel administrativo.</div><button class="button" data-out>Sair</button></section></main>';return}return admin()}if(!S.slug){if(S.admin){location.href=url('admin');return}root.innerHTML='<main class="login"><section class="card"><div class="notice">Abra o link exclusivo enviado pelo estúdio para acessar o seu portal.</div></section></main>';return}client()}function chip(c){return`<div class="client ${S.selected?.id===c.id?'active':''}"><i class="client-logo" style="--accent:${e(c.accent_color)}">${c.logo_url?`<img src="${e(c.logo_url)}" alt="">`:ini(c.name)}</i><button data-client="${c.id}">${e(c.name)}<br><span class="meta">/${e(c.slug)} ${c.active?'':'• pausado'}</span></button><a class="button ghost small" target="_blank" href="${url('client',c.slug)}">Abrir</a></div>`}async function admin(){try{let cs=await get('client_portal_clients',db.from('client_portal_clients').select('*').order('created_at',{ascending:false}));S.selected=cs.find(x=>x.id===S.selected?.id)||cs[0]||null;let body=S.tab==='visao'?overview(cs):S.tab==='clientes'?clients(cs):S.selected?(S.tab==='conteudo'?content(S.selected):brand(S.selected)):`<section class="card"><div class="empty">Crie ou selecione um cliente antes de publicar conteúdo.</div></section>`;let warn=S.missing.size?`<div class="notice">Módulos aguardando migração: ${[...S.missing].join(', ')}. O restante continua disponível.</div>`:'';root.innerHTML=shell('Portal do Cliente','RMS Studio',warn+body,true);bindAdmin(cs)}catch(x){root.innerHTML=shell('Configuração necessária','RMS Studio',`<section class="card"><div class="notice error"><b>O painel não conseguiu carregar o banco.</b><br>${e(x.message)}<br><br>Execute a migração do Portal no Supabase antes de utilizar o painel.</div></section>`,true)}}function overview(cs){return`<section class="grid metrics"><article class="card metric"><span>Clientes ativos</span><strong>${cs.filter(x=>x.active).length}</strong></article><article class="card metric" style="--bubble:rgba(22,122,131,.22)"><span>Portais criados</span><strong>${cs.length}</strong></article><article class="card metric" style="--bubble:rgba(132,189,54,.25)"><span>Próximo movimento</span><strong style="font-size:23px;line-height:1.05">${cs.length?'Atualizar':'Criar cliente'}</strong></article><article class="card metric" style="--bubble:rgba(31,57,80,.18)"><span>Canal de acesso</span><strong style="font-size:23px;line-height:1.05">Privado</strong></article></section><section class="grid two"><article class="card"><div class="head"><div><h2>Começo rápido</h2><p>Três ações para abrir um portal.</p></div></div><div class="list"><div class="item"><i class="dot" style="--item:var(--orange)"></i><main><p class="title">1. Crie o cliente</p><p class="meta">Defina nome, URL e identidade visual.</p></main></div><div class="item"><i class="dot"></i><main><p class="title">2. Publique o contexto</p><p class="meta">Inclua projeto, agenda, ações e aprovações.</p></main></div><div class="item"><i class="dot" style="--item:var(--green)"></i><main><p class="title">3. Gere o convite</p><p class="meta">Envie a URL exclusiva pelo canal combinado.</p></main></div></div></article><article class="card"><div class="head"><div><h2>Clientes recentes</h2><p>Abrir e editar rapidamente.</p></div><button class="button orange small" data-nav="clientes">Novo cliente</button></div><div class="list">${cs.length?cs.slice(0,5).map(chip).join(''):'<div class="empty">Nenhum cliente criado ainda.</div>'}</div></article></section>`}function clients(cs){return`<section class="split"><article class="card"><div class="head"><div><h2>Seus clientes</h2><p>Selecione para organizar.</p></div></div><div class="list">${cs.length?cs.map(chip).join(''):'<div class="empty">Ainda não há clientes.</div>'}</div></article><article class="card"><div class="head"><div><h2>Novo cliente</h2><p>O slug vira a URL exclusiva.</p></div></div><form class="form two" data-form="new-client"><div class="field"><label>Nome</label><input name="name" required placeholder="Ex.: Estúdio Aurora"></div><div class="field"><label>Slug da URL</label><input name="slug" required placeholder="ex.: estudio-aurora"></div><div class="field"><label>Cor de destaque</label><input name="accent_color" type="color" value="#f97316"></div><div class="field"><label>Mensagem de boas-vindas</label><input name="welcome_message" value="Seu espaço de acompanhamento está pronto."></div><div class="field" style="grid-column:1/-1"><label>Recado inicial</label><textarea name="note_to_client" placeholder="Explique o que a pessoa encontrará aqui."></textarea></div><div class="actions" style="grid-column:1/-1"><button class="button orange">Criar portal do cliente</button></div></form></article></section>`}function module(k,h,fields,label='Publicar'){return`<article class="card"><div class="head"><h3>${h}</h3></div><form class="form two" data-form="module" data-kind="${k}">${fields}<div class="actions" style="grid-column:1/-1"><button class="button orange">${label}</button></div></form></article>`}function content(c){return`<section class="card hero"><div class="eyebrow" style="color:#ffbc79">Conteúdo do cliente</div><h2>${e(c.name)}</h2><p>Publique o que o cliente precisa acompanhar. Cada item aparece no portal exclusivo assim que é salvo.</p><div class="actions" style="justify-content:flex-start"><a class="button orange" target="_blank" href="${url('client',c.slug)}">Ver portal</a><button class="button ghost" data-copy="${url('client',c.slug)}">Copiar URL</button></div></section><section class="grid two" style="margin-top:16px">${module('project','Novo projeto',`<div class="field"><label>Nome</label><input name="title" required></div><div class="field"><label>Progresso</label><input name="progress" type="number" min="0" max="100" value="0"></div><div class="field"><label>Etapa atual</label><input name="current_stage" placeholder="Ex.: Pesquisa"></div><div class="field"><label>Próximo passo</label><input name="next_step" placeholder="Ex.: Alinhar referências"></div><div class="field"><label>Prazo</label><input name="due_date" type="date"></div><div class="field"><label>Status</label><select name="status"><option value="active">Ativo</option><option value="waiting_client">Aguardando cliente</option><option value="review">Em revisão</option><option value="delivered">Entregue</option></select></div><div class="field" style="grid-column:1/-1"><label>Contexto</label><textarea name="description"></textarea></div>`)}${module('event','Novo item na agenda',`<div class="field"><label>Título</label><input name="title" required></div><div class="field"><label>Data e horário</label><input name="starts_at" type="datetime-local" required></div><div class="field"><label>Categoria</label><input name="category" value="agenda"></div><div class="field"><label>Cor</label><input name="color" type="color" value="#167A83"></div><div class="field" style="grid-column:1/-1"><label>Observação</label><textarea name="notes"></textarea></div>`)}${module('task','Nova ação',`<div class="field"><label>Título</label><input name="title" required></div><div class="field"><label>Prazo</label><input name="due_date" type="date"></div><div class="field"><label>Responsável</label><select name="assignee_role"><option value="studio">Estúdio</option><option value="client">Cliente</option></select></div><div class="field"><label>Prioridade</label><select name="priority"><option>normal</option><option>high</option><option>urgent</option><option>low</option></select></div><div class="field" style="grid-column:1/-1"><label>Descrição</label><textarea name="description"></textarea></div>`)}${module('approval','Nova aprovação',`<div class="field"><label>Título</label><input name="title" required></div><div class="field"><label>Link de prévia</label><input name="preview_url" type="url"></div><div class="field" style="grid-column:1/-1"><label>Orientação</label><textarea name="description"></textarea></div>`)}${module('note','Nova atualização',`<div class="field"><label>Título</label><input name="title" required></div><div class="field"><label>Visibilidade</label><select name="visibility"><option value="client">Cliente</option><option value="internal">Interna</option></select></div><div class="field" style="grid-column:1/-1"><label>Mensagem</label><textarea name="body" required></textarea></div>`)}${module('moment','Novo momento',`<div class="field"><label>Tipo</label><select name="type"><option value="milestone">Marco</option><option value="check_in">Check-in</option><option value="behind_scenes">Bastidores</option><option value="celebration">Celebração</option></select></div><div class="field"><label>Título</label><input name="title" required></div><div class="field" style="grid-column:1/-1"><label>Mensagem</label><textarea name="body" required></textarea></div>`)}${module('invite','Convidar cliente',`<div class="field" style="grid-column:1/-1"><label>E-mail</label><input name="email" type="email" required placeholder="cliente@empresa.com"></div><p class="meta" style="grid-column:1/-1;margin:0">O sistema gera uma URL de convite válida por 14 dias. Envie pelo canal combinado.</p>`,'Gerar convite')}</section>`}function brand(c){return`<section class="grid two"><article class="card"><div class="head"><div><h2>Identidade do portal</h2><p>Personalize cada cliente sem alterar o seu portfólio.</p></div></div><form class="form two" data-form="brand"><div class="field"><label>Nome</label><input name="name" value="${e(c.name)}"></div><div class="field"><label>Cor</label><input name="accent_color" type="color" value="${e(c.accent_color)}"></div><div class="field" style="grid-column:1/-1"><label>Logo por URL</label><input name="logo_url" type="url" value="${e(c.logo_url||'')}"></div><div class="field" style="grid-column:1/-1"><label>Mensagem inicial</label><textarea name="welcome_message">${e(c.welcome_message)}</textarea></div><div class="field" style="grid-column:1/-1"><label>Recado do estúdio</label><textarea name="note_to_client">${e(c.note_to_client||'')}</textarea></div><div class="actions" style="grid-column:1/-1"><button class="button orange">Salvar identidade</button></div></form></article><article class="card"><div class="head"><div><h2>Arquivos protegidos</h2><p>Os materiais ficam privados no Supabase.</p></div></div><form class="form" data-form="upload"><div class="field"><label>Arquivo</label><input name="file" type="file" required></div><div class="field"><label>Tipo</label><select name="kind"><option value="material">Material</option><option value="preview">Prévia</option><option value="delivery">Entrega</option><option value="reference">Referência</option></select></div><button class="button">Enviar arquivo</button></form></article></section>`}function bindAdmin(cs){root.querySelectorAll('[data-nav]').forEach(x=>x.onclick=()=>{S.tab=x.dataset.nav;admin()});root.querySelectorAll('[data-client]').forEach(x=>x.onclick=()=>{S.selected=cs.find(c=>c.id===x.dataset.client);S.tab='conteudo';admin()});root.querySelectorAll('form').forEach(x=>x.onsubmit=adminForm);root.querySelectorAll('[data-copy]').forEach(x=>x.onclick=async()=>{await navigator.clipboard.writeText(location.origin+x.dataset.copy);toast('URL copiada.')});root.querySelector('[data-out]')?.addEventListener('click',out)}async function adminForm(a){a.preventDefault();let f=a.currentTarget,d=new FormData(f);try{if(f.dataset.form==='new-client'){let{data,error}=await db.from('client_portal_clients').insert({owner_id:S.user.id,name:d.get('name'),slug:slug(d.get('slug')),accent_color:d.get('accent_color'),welcome_message:d.get('welcome_message'),note_to_client:d.get('note_to_client')}).select().single();if(error)throw error;S.selected=data;S.tab='conteudo';toast('Portal criado.');return admin()}let c=S.selected;if(f.dataset.form==='brand'){let{error}=await db.from('client_portal_clients').update({name:d.get('name'),accent_color:d.get('accent_color'),logo_url:d.get('logo_url')||null,welcome_message:d.get('welcome_message'),note_to_client:d.get('note_to_client')||null}).eq('id',c.id);if(error)throw error;toast('Identidade atualizada.');return admin()}if(f.dataset.form==='module'){let k=f.dataset.kind,map={project:'client_portal_projects',event:'client_portal_events',task:'client_portal_tasks',approval:'client_portal_approvals',note:'client_portal_notes',moment:'client_portal_moments',invite:'client_portal_invites'},row=Object.fromEntries(d.entries());row.client_id=c.id;if(k==='project')row.progress=Number(row.progress||0);if(k==='invite'){row.created_by=S.user.id;let{data,error}=await db.from(map[k]).insert(row).select().single();if(error)throw error;let u=location.origin+url('client',c.slug)+'&invite='+data.token;await navigator.clipboard.writeText(u);toast('Convite criado e copiado.');f.reset();return}let{error}=await db.from(map[k]).insert(row);if(error)throw error;toast('Conteúdo publicado.');f.reset();return}if(f.dataset.form==='upload'){let file=d.get('file'),clean=file.name.normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-zA-Z0-9._-]/g,'-'),p=`${c.id}/${Date.now()}-${clean}`,{error:up}=await db.storage.from(C.bucket).upload(p,file);if(up)throw up;let{error}=await db.from('client_portal_files').insert({client_id:c.id,name:file.name,path:p,kind:d.get('kind'),uploaded_by:S.user.id});if(error)throw error;toast('Arquivo enviado.');f.reset()}}catch(x){toast(x.message||'Não foi possível salvar.')}}async function client(){try{let invite=P.get('invite');if(invite){let{error}=await db.rpc('client_portal_accept_invite',{invite_token:invite});if(error&&!schema(error))toast('Convite não pôde ser aplicado.')}let c=(await get('client_portal_clients',db.from('client_portal_clients').select('*').eq('slug',S.slug).eq('active',true).limit(1)))[0];if(!c){root.innerHTML='<main class="login"><section class="card"><div class="notice error">Este portal não está disponível para esta conta. Verifique o link ou peça um convite ao estúdio.</div></section></main>';return}let[projects,events,tasks,approvals,notes,moments,files]=await Promise.all([get('client_portal_projects',db.from('client_portal_projects').select('*').eq('client_id',c.id).order('created_at',{ascending:false})),get('client_portal_events',db.from('client_portal_events').select('*').eq('client_id',c.id).order('starts_at')),get('client_portal_tasks',db.from('client_portal_tasks').select('*').eq('client_id',c.id).neq('status','archived').order('due_date')),get('client_portal_approvals',db.from('client_portal_approvals').select('*').eq('client_id',c.id).neq('status','archived').order('created_at',{ascending:false})),get('client_portal_notes',db.from('client_portal_notes').select('*').eq('client_id',c.id).eq('visibility','client').order('created_at',{ascending:false})),get('client_portal_moments',db.from('client_portal_moments').select('*').eq('client_id',c.id).order('created_at',{ascending:false})),get('client_portal_files',db.from('client_portal_files').select('*').eq('client_id',c.id).order('created_at',{ascending:false}))]);let open=tasks.filter(x=>!['done','archived'].includes(x.status)).length,waiting=approvals.filter(x=>x.status==='pending').length;let body=`<section class="card hero"><div class="eyebrow" style="color:#ffbb77">Espaço de acompanhamento</div><h2>${e(c.name)}</h2><p>${e(c.welcome_message)}</p>${c.note_to_client?`<div class="notice" style="background:rgba(255,255,255,.14);color:white">${e(c.note_to_client)}</div>`:''}</section><section class="grid metrics" style="margin-top:16px"><article class="card metric"><span>Projetos em andamento</span><strong>${projects.filter(x=>!['delivered','archived'].includes(x.status)).length}</strong></article><article class="card metric" style="--bubble:rgba(22,122,131,.23)"><span>Próximas ações</span><strong>${open}</strong></article><article class="card metric" style="--bubble:rgba(249,115,22,.24)"><span>Aprovações abertas</span><strong>${waiting}</strong></article><article class="card metric" style="--bubble:rgba(102,166,70,.25)"><span>Atualizações</span><strong>${notes.length}</strong></article></section><section class="grid two"><article class="card"><div class="head"><div><h2>Onde estamos</h2><p>Projetos e próximos movimentos.</p></div></div>${projects.length?`<div class="list">${projects.map(x=>`<div class="item"><i class="dot" style="--item:var(--orange)"></i><main><div style="display:flex;justify-content:space-between;gap:10px"><p class="title">${e(x.title)}</p><span class="tag">${e(x.current_stage||x.status)}</span></div><p class="meta">${e(x.description||x.next_step||'O estúdio atualiza o contexto aqui.')}</p><div class="progress"><i style="width:${Math.min(100,Math.max(0,x.progress||0))}%"></i></div><p class="meta">${e(x.next_step||'Próximo passo em definição')}</p></main></div>`).join('')}</div>`:'<div class="empty">O contexto inicial do projeto aparecerá aqui.</div>'}</article><article class="card" id="agenda"><div class="head"><div><h2>Agenda em foco</h2><p>Datas que merecem atenção.</p></div></div>${events.length?`<div class="list">${events.slice(0,7).map(x=>`<div class="item"><i class="dot" style="--item:${e(x.color)}"></i><main><p class="title">${e(x.title)}</p><p class="meta">${when(x.starts_at)}${x.notes?' • '+e(x.notes):''}</p></main><span class="tag wait">${e(x.category)}</span></div>`).join('')}</div>`:'<div class="empty">Nenhuma data publicada por enquanto.</div>'}</article></section><section class="grid two" style="margin-top:16px"><article class="card" id="acoes"><div class="head"><div><h2>O que precisa acontecer</h2><p>Itens claros para manter o projeto fluindo.</p></div></div>${tasks.length?`<div class="list">${tasks.map(x=>`<div class="item"><button class="check ${x.status==='done'?'done':''}" data-task="${x.id}" data-status="${x.status}">${x.status==='done'?'✓':''}</button><main><p class="title">${e(x.title)}</p><p class="meta">${e(x.description||'Sem observação adicional.')}${x.due_date?' • '+day(x.due_date):''}</p></main><span class="tag ${x.status==='done'?'done':''}">${x.status==='done'?'feito':x.assignee_role==='client'?'sua ação':'estúdio'}</span></div>`).join('')}</div>`:'<div class="empty">Nenhuma ação pendente no momento.</div>'}</article><article class="card" id="aprovar"><div class="head"><div><h2>Materiais para aprovar</h2><p>Seu retorno define o próximo passo.</p></div></div>${approvals.length?`<div class="list">${approvals.map(x=>`<div class="item"><i class="dot" style="--item:${x.status==='approved'?'var(--green)':'var(--orange)'}"></i><main><p class="title">${e(x.title)}</p><p class="meta">${e(x.description||'Avalie e compartilhe seu retorno.')}</p>${x.preview_url?`<a class="link" target="_blank" href="${e(x.preview_url)}">Abrir prévia</a>`:''}${x.status==='pending'?`<div class="actions" style="justify-content:flex-start;margin-top:9px"><button class="button small" data-approval="${x.id}" data-decision="approved">Aprovar</button><button class="button ghost small" data-revise="${x.id}">Pedir ajuste</button></div>`:`<p class="meta">Decisão registrada.</p>`}</main></div>`).join('')}</div>`:'<div class="empty">Nada aguardando aprovação.</div>'}</article></section><section class="grid two" style="margin-top:16px"><article class="card"><div class="head"><div><h2>Atualizações do estúdio</h2><p>O que já avançou e o que vem agora.</p></div></div>${notes.length?`<div class="list">${notes.slice(0,6).map(x=>`<div class="item"><i class="dot" style="--item:var(--orange)"></i><main><p class="title">${e(x.title)}</p><p class="meta">${e(x.body)}<br>${day(x.created_at)}</p></main></div>`).join('')}</div>`:'<div class="empty">As próximas atualizações aparecerão aqui.</div>'}</article><article class="card" id="materiais"><div class="head"><div><h2>Materiais e entregas</h2><p>Arquivos liberados para este projeto.</p></div></div>${files.length?`<div class="list">${files.map(x=>`<div class="item"><i class="dot"></i><main><p class="title">${e(x.name)}</p><p class="meta">${e(x.kind)} • ${day(x.created_at)}</p></main><button class="button ghost small" data-file="${e(x.path)}">Baixar</button></div>`).join('')}</div>`:'<div class="empty">Materiais liberados aparecerão aqui.</div>'}</article></section>${moments.length?`<section class="card" style="margin-top:16px"><div class="head"><div><h2>Um momento do projeto</h2><p>Pequenas conquistas também contam.</p></div></div><div class="list">${moments.slice(0,3).map(x=>`<div class="item"><i class="dot" style="--item:#83a740"></i><main><span class="tag">${e(x.type)}</span><p class="title" style="margin-top:7px">${e(x.title)}</p><p class="meta">${e(x.body)}</p></main></div>`).join('')}</div></section>`:''}`;root.innerHTML=shell(c.name,'RMS Portal',body,false);bindClient(c)}catch(x){root.innerHTML='<main class="login"><section class="card"><div class="notice error"><b>Não foi possível abrir este portal.</b><br>'+e(x.message||'Tente novamente mais tarde.')+'</div></section></main>'}}function bindClient(c){root.querySelectorAll('[data-scroll]').forEach(x=>x.onclick=()=>document.querySelector('#'+x.dataset.scroll)?.scrollIntoView({behavior:'smooth'}));root.querySelectorAll('[data-task]').forEach(x=>x.onclick=async()=>{let n=x.dataset.status==='done'?'open':'done',{error}=await db.from('client_portal_tasks').update({status:n,completed_at:n==='done'?new Date().toISOString():null}).eq('id',x.dataset.task);if(error)return toast(error.message);toast(n==='done'?'Ação marcada como feita.':'Ação reaberta.');client()});root.querySelectorAll('[data-approval]').forEach(x=>x.onclick=()=>decision(x.dataset.approval,x.dataset.decision,''));root.querySelectorAll('[data-revise]').forEach(x=>x.onclick=()=>revision(x.dataset.revise));root.querySelectorAll('[data-file]').forEach(x=>x.onclick=()=>download(x.dataset.file));root.querySelector('[data-out]')?.addEventListener('click',out);realtime(c.id)}async function decision(id,status,comment){let{error}=await db.from('client_portal_approvals').update({status,client_comment:comment||null,decision_at:new Date().toISOString()}).eq('id',id);if(error)return toast(error.message);toast(status==='approved'?'Aprovação registrada.':'Pedido de ajuste enviado.');client()}function revision(id){let m=document.createElement('div');m.className='modal-wrap';m.innerHTML=`<section class="modal"><div class="head"><div><h2>Pedir ajuste</h2><p>Explique o que precisa mudar para o estúdio.</p></div><button class="button ghost small" data-close>Fechar</button></div><form class="form"><div class="field"><label>Seu retorno</label><textarea name="comment" required placeholder="Ex.: Ajustar contraste do título."></textarea></div><div class="actions"><button class="button orange">Enviar retorno</button></div></form></section>`;document.body.append(m);m.querySelector('[data-close]').onclick=()=>m.remove();m.querySelector('form').onsubmit=async a=>{a.preventDefault();await decision(id,'revision_requested',new FormData(a.target).get('comment'));m.remove()}}async function download(p){let{data,error}=await db.storage.from(C.bucket).createSignedUrl(p,120);if(error)return toast(error.message);open(data.signedUrl,'_blank','noopener')}function realtime(id){if(S.channel)db.removeChannel(S.channel);S.channel=db.channel('client-'+id).on('postgres_changes',{event:'*',schema:'public',table:'client_portal_projects',filter:'client_id=eq.'+id},client).on('postgres_changes',{event:'*',schema:'public',table:'client_portal_events',filter:'client_id=eq.'+id},client).on('postgres_changes',{event:'*',schema:'public',table:'client_portal_tasks',filter:'client_id=eq.'+id},client).on('postgres_changes',{event:'*',schema:'public',table:'client_portal_approvals',filter:'client_id=eq.'+id},client).on('postgres_changes',{event:'*',schema:'public',table:'client_portal_notes',filter:'client_id=eq.'+id},client).subscribe()}function slug(v){return String(v||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'')}async function out(){if(S.channel)db.removeChannel(S.channel);await db.auth.signOut();location.href=base()}document.addEventListener('click',x=>{if(x.target.matches('[data-out]'))out()});boot()})();

<script>
/* RMS Portal: complemento de autenticação. Clientes entram com nome de usuário. */
(() => {
  const config = {
    url: 'https://wklmiuqqkdzufvkdzxff.supabase.co',
    key: 'sb_publishable_yb9kOoPoQTs9YnzaoBcG6g_N4IwQHwG'
  };
  const portalDb = supabase.createClient(config.url, config.key);
  const isAdminMode = () => new URLSearchParams(location.search).get('mode') === 'admin';
  const esc = value => String(value ?? '').replace(/[&<>'"]/g, char => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
  }[char]));

  function showLoginError(message) {
    const note = document.querySelector('#login-note');
    if (note) note.innerHTML = `<div class="notice error">${esc(message)}</div>`;
  }

  function adaptClientLogin() {
    if (isAdminMode()) return;
    const form = document.querySelector('#login');
    const firstField = form?.querySelector('.field');
    const identity = form?.elements?.email;
    if (!form || !firstField || !identity || form.dataset.usernameReady === 'true') return;

    form.dataset.usernameReady = 'true';
    const label = firstField.querySelector('label');
    if (label) label.textContent = 'Nome de usuário';
    identity.name = 'username';
    identity.type = 'text';
    identity.autocomplete = 'username';
    identity.placeholder = 'ex.: estudio-aurora';
    identity.removeAttribute('inputmode');
    firstField.insertAdjacentHTML('beforeend', '<small class="meta">Use o nome enviado pelo estúdio. Letras minúsculas, números, ponto, hífen e sublinhado são aceitos.</small>');

    const description = form.parentElement?.querySelector('p.meta');
    if (description) description.textContent = 'No primeiro acesso, o estúdio envia o seu nome de usuário e orienta a criação da senha.';

    form.onsubmit = async event => {
      event.preventDefault();
      const username = String(form.elements.username?.value || '').trim().toLowerCase();
      const password = String(form.elements.password?.value || '');
      if (!username || !password) return showLoginError('Informe seu nome de usuário e sua senha.');

      const button = form.querySelector('button[type="submit"], button:not([type])');
      const original = button?.textContent;
      if (button) {
        button.disabled = true;
        button.textContent = 'Entrando...';
      }

      const lookup = await portalDb.rpc('resolve_portal_username', { p_username: username });
      if (lookup.error || !lookup.data) {
        showLoginError('Não foi possível entrar com estes dados. Confira o nome de usuário e a senha.');
        if (button) {
          button.disabled = false;
          button.textContent = original;
        }
        return;
      }

      const signIn = await portalDb.auth.signInWithPassword({ email: lookup.data, password });
      if (signIn.error) {
        showLoginError('Não foi possível entrar com estes dados. Confira o nome de usuário e a senha.');
        if (button) {
          button.disabled = false;
          button.textContent = original;
        }
        return;
      }
      location.reload();
    };
  }

  async function appendUsernameManager() {
    if (!isAdminMode()) return;
    const activeTab = document.querySelector('[data-nav="marca"].active');
    const main = document.querySelector('.shell main');
    if (!activeTab || !main || main.querySelector('[data-username-access]')) return;

    const session = await portalDb.auth.getSession();
    if (!session.data.session) return;
    const clients = await portalDb.from('client_portal_clients').select('id,name,slug').order('name');
    if (clients.error) return;

    const options = clients.data.map(client => `<option value="${esc(client.id)}">${esc(client.name)} · /${esc(client.slug)}</option>`).join('');
    main.insertAdjacentHTML('beforeend', `
      <section class="card" data-username-access style="margin-top:16px">
        <div class="head"><div><h2>Acesso por nome de usuário</h2><p>Defina o login simples depois que o cliente aceitar o convite.</p></div></div>
        <form class="form" data-username-form>
          <div class="form two">
            <div class="field"><label>Cliente</label><select name="clientId" required><option value="">Selecione</option>${options}</select></div>
            <div class="field"><label>E-mail da conta</label><input name="email" type="email" autocomplete="email" required placeholder="cliente@empresa.com"></div>
          </div>
          <div class="field"><label>Nome de usuário</label><input name="username" type="text" autocomplete="username" required placeholder="ex.: aurora.estudio" pattern="[a-z0-9][a-z0-9._-]{2,39}"><small class="meta">Use de 3 a 40 caracteres. O nome é único para todo o Portal.</small></div>
          <div class="actions"><button class="button orange">Salvar nome de usuário</button></div>
        </form>
      </section>
    `);

    const form = main.querySelector('[data-username-form]');
    form.onsubmit = async event => {
      event.preventDefault();
      const values = new FormData(form);
      const submit = form.querySelector('button');
      const original = submit.textContent;
      submit.disabled = true;
      submit.textContent = 'Salvando...';
      const result = await portalDb.rpc('set_client_portal_username', {
        target_client_id: values.get('clientId'),
        target_email: values.get('email'),
        desired_username: String(values.get('username') || '').trim().toLowerCase()
      });
      submit.disabled = false;
      submit.textContent = original;
      if (result.error) return alert(result.error.message);
      alert(`Nome de usuário @${result.data} salvo. Envie este nome ao cliente.`);
      form.reset();
    };
  }

  const watch = () => {
    adaptClientLogin();
    appendUsernameManager();
  };
  new MutationObserver(watch).observe(document.documentElement, { childList: true, subtree: true });
  setTimeout(watch, 0);
  setTimeout(watch, 350);
})();
</script>
