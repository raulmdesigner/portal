<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Redirecionando</title><script>(function(){var p=location.pathname.split('/').filter(Boolean),i=p.lastIndexOf('cliente'),base=i>0?'/'+p.slice(0,i).join('/'):'';if(i>=0&&p[i+1]){var q=new URLSearchParams(location.search),out=base+'/?client='+encodeURIComponent(p[i+1]);if(q.get('invite'))out+='&invite='+encodeURIComponent(q.get('invite'));location.replace(out);return}location.replace(base+'/')})()</script></head><body></body></html>
